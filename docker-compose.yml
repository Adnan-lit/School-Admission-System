name: school-admission

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment:
    # GSS is Kerberos login, which isn't used here. Disabling it stops a "cannot load library" log line.
    # The pool is capped so two backend processes stay under Postgres's default limit of 100 connections.
    ConnectionStrings__Default: ${DB_CONNECTION_STRING:-Host=db;Port=5432;Database=school_admission;Username=admission;Password=admission;GSS Encryption Mode=Disable;Maximum Pool Size=40;Timeout=30}
    HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: admission
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Checking over TCP stops this passing during first-run setup, when Postgres only listens on a socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U admission -d school_admission"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    <<: *backend
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # The browser makes these calls, so this must be an address the browser can reach, not "backend".
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:80"

  # A second backend process on port 8081, sharing the same database.
  # Starts only on demand: docker compose --profile two-backends up -d
  backend-2:
    <<: *backend
    profiles: ["two-backends", "load-test"]
    ports:
      - "8081:8080"

  # Sends a burst of applicants to both backend processes and checks that no class is oversold.
  # Runs only on demand, and starts both backends itself: docker compose run --rm load-test
  load-test:
    image: node:24-slim
    profiles: ["load-test"]
    depends_on:
      - backend
      - backend-2
    environment:
      BACKEND_URLS: http://backend:8080,http://backend-2:8080
      SEATS: ${SEATS:-100}
      APPLICANTS: ${APPLICANTS:-2000}
    volumes:
      - ./scripts/load-test.mjs:/load-test.mjs:ro
    command: ["node", "/load-test.mjs"]

  # Runs only on demand: docker compose run --rm --build backend-tests
  # It uses its own database on the same server, so the app's data is untouched.
  backend-tests:
    build:
      context: ./backend
      target: test
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=school_admission_test;Username=admission;Password=admission;GSS Encryption Mode=Disable;Maximum Pool Size=40;Timeout=30

  # Runs only on demand: docker compose run --rm --build frontend-tests
  frontend-tests:
    build:
      context: ./frontend
      target: test
    profiles: ["test"]

volumes:
  postgres-data:
