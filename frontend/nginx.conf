server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Written at container start, so browsers must not keep an old copy.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Unknown paths go to React so refreshing any page still works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
