server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript;

    # Written at container start, so browsers must not keep an old copy.
    location = /config.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # These file names contain a hash of their contents, so a cached copy can never be out of date.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Unknown paths go to React so refreshing any page still works.
    # The browser checks for a new version each time, so a new deployment shows up straight away.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
