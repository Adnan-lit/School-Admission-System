# Included in each location, because nginx drops inherited headers from any block that adds its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;

# connect-src stays open because the backend address is configurable when the container starts.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
